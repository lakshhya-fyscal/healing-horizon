<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healing Horizon — EFT & Counselling with Vrinda Goel</title>
    <meta name="description" content="A compassionate space for reflection, healing, and growth. EFT Practitioner & Counselling Psychologist Vrinda Goel helps you take meaningful action toward better mental health." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Hidden static forms so Netlify's build-time bot can detect and
         register these forms — the real forms are rendered by React and
         are invisible to Netlify's static-HTML scan. Keep field names in
         sync with src/App.jsx (Contact) and src/Workshops.jsx (WorkshopContact). -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="service">
        <option>Free Discovery Call (20 min)</option>
        <option>EFT Tapping Session</option>
        <option>Counselling</option>
        <option>Not sure yet</option>
      </select>
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <form name="workshops-contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="org" />
      <input type="text" name="location" />
      <select name="interest">
        <option>Attending a future workshop</option>
        <option>Hosting a workshop for my organisation</option>
        <option>Just curious — tell me more</option>
      </select>
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
